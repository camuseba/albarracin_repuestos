name: Sincronizacion Diaria de Catalogo Vehicular

on:
  schedule:
    # 03:30 AM Argentina (06:30 UTC)
    - cron: '30 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validar servicio y pruebas sin modificar la base publicada
        run: |
          python -m compileall -q compatibility_service.py dnrpa_provider.py dnrpa_sync.py parts_compatibility_sync.py
          python test_dnrpa_compatibility.py
          git diff --exit-code -- compatibility_db.json

      - name: Ejecutar sincronizador DNRPA o catalogo interno
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          DNRPA_ENABLED: ${{ vars.DNRPA_ENABLED || 'false' }}
          DNRPA_CONNECTION_TYPE: ${{ vars.DNRPA_CONNECTION_TYPE || 'REST_API' }}
          DNRPA_API_URL: ${{ secrets.DNRPA_API_URL }}
          DNRPA_CLIENT_ID: ${{ secrets.DNRPA_CLIENT_ID }}
          DNRPA_CLIENT_SECRET: ${{ secrets.DNRPA_CLIENT_SECRET }}
          DNRPA_USERNAME: ${{ secrets.DNRPA_USERNAME }}
          DNRPA_PASSWORD: ${{ secrets.DNRPA_PASSWORD }}
          DNRPA_CERTIFICATE_PATH: ${{ vars.DNRPA_CERTIFICATE_PATH }}
          DNRPA_TIMEOUT_SECONDS: ${{ vars.DNRPA_TIMEOUT_SECONDS || '15' }}
        run: python dnrpa_sync.py --run-now

      - name: Commitear base actualizada hacia Netlify
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(cron): actualizacion diaria de base vehicular compatibility_db.json [skip ci]"
          file_pattern: "compatibility_db.json club_albarracin_fidelizacion/compatibility_db.json"
